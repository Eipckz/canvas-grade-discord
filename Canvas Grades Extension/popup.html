<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canvas Grades</title><link rel="stylesheet" href="style.css"></head><body>
<main class="popup">
  <div style="display:flex;justify-content:space-between;align-items:center"><div><p class="muted small">CANVAS GRADES</p><h1 id="who" style="font-size:17px">Grade check</h1></div><span id="pill" class="pill">…</span></div>
  <div id="status" class="banner small" role="status" hidden></div>
  <div><p class="muted small">Estimated GPA <b id="gpa">–</b> · <span id="checked"></span></p><div id="courses"></div></div>
  <div class="actions"><button id="send" type="button">Send now</button><button id="open" type="button" class="secondary">Open dashboard</button></div>
</main>
<script type="module" src="popup.js"></script></body></html>
